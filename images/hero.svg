<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="Kanao, The Reconciler">
  <title>Kanao, The Reconciler</title>
  <desc>A goddess holds a declared blueprint in her left hand and the living system in her right, the gap between them burning as drift, with four attendants tending a pipeline, a ledger, a set of scales, and a gate.</desc>

  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset="0.5" stop-color="#131d28"/>
      <stop offset="1" stop-color="#090e14"/>
    </linearGradient>
    <radialGradient id="aureole" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3c98a" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#d98a3f" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d98a3f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="driftcore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4e0" stop-opacity="0.98"/>
      <stop offset="0.3" stop-color="#f6b866" stop-opacity="0.82"/>
      <stop offset="0.64" stop-color="#dd7f33" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#c25f22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41556a"/>
      <stop offset="0.5" stop-color="#28353f"/>
      <stop offset="1" stop-color="#151e26"/>
    </linearGradient>
    <linearGradient id="robelit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8aa0b6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8aa0b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coolplate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c435c"/>
      <stop offset="1" stop-color="#152130"/>
    </linearGradient>
    <linearGradient id="warmmass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b05c20"/>
      <stop offset="1" stop-color="#542b12"/>
    </linearGradient>
    <linearGradient id="floorfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118" stop-opacity="0"/>
      <stop offset="1" stop-color="#090e14" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="hazy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#ground)"/>

