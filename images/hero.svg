    <text x="50" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#7f9bb5" letter-spacing="1.6">GATE</text>
  </g>

  <g text-anchor="middle">
    <text x="800" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#f2e7d3" letter-spacing="13">Kanao</text>
    <text x="800" y="706" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#c9a06a" letter-spacing="8">THE RECONCILER</text>
    <text x="800" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#9fb2c4" letter-spacing="0.5">Declared is not delivered. Only measurement tells them apart.</text>
