<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Partial-credit pass rate by tier. mean blended score over 8 runs per model, tiers cut on opus-5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050c0c"/>
      <stop offset="60%" stop-color="#0a1e1c"/>
      <stop offset="100%" stop-color="#071313"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e2ac52"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(5,12,12,0.55)" stroke-width="3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="110" y="72" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', ui-serif, serif" font-size="40" font-weight="bold" fill="#eef2ea">Partial-credit pass rate by tier</text>
  <text x="110" y="108" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="19" fill="#9fc4bc">mean blended score over 8 runs per model, tiers cut on opus-5</text>
  <line x1="1180" y1="47" x2="1226" y2="47" stroke="#35d0ba" stroke-width="4"/>
  <circle cx="1203" cy="47" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
  <text x="1238" y="54" font-family="'JetBrains Mono','SF Mono','Berkeley Mono',ui-monospace,'Courier New',monospace" font-size="20" fill="#eef2ea">opus-5</text>
