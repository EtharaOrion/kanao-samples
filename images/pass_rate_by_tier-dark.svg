  <polygon points="1301.6666666666667,590.1383333333333 1310.6666666666667,599.1383333333333 1301.6666666666667,608.1383333333333 1292.6666666666667,599.1383333333333" fill="url(#hatch)" stroke="#0f2723" stroke-width="2.5"/>
  <circle cx="1301.7" cy="566.3" r="8" fill="#35d0ba" stroke="#0f2723" stroke-width="3"/>
