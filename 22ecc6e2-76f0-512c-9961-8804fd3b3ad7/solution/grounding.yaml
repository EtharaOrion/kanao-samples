schema_version: forge.grounding/v1
task_slug: pipeline-horizon__release-observe-repair
primary_archetype: AR1
project_archetype: pipeline-horizon
category: deployment
language: go
trusted_engine:
  path: /usr/local/bin/relx
  source: environment/src/relx/main.go
  immutable: true
  role: threads an accumulating stage ledger and refuses to record a stage against a truncated or fabricated history
repair_surface:
  - /workspace/bin/run-release
  - /workspace/state
protected_surface:
  - /workspace/release/order.spec
seeded_fault:
  location: /workspace/bin/run-release
  mechanism: promote is run against an isolated ledger seeded by relx snapshot --last 1 and copied back over the ledger of record, so the accumulated compile and migrate records are dropped and the release collapses to a truncated history
  observable: engine manifest reports complete false, records below five, promote and finalize carry fewer prior records than their index
ground_truth_fix:
  mechanism: thread the full accumulating ledger through every stage so promote and finalize record against the complete history
  reference: solution/solve.sh
verifier:
  policy: outcome-based-only
  solved_only_at: 1.0000
  evidence_required:
    - fail-to-pass
    - pass-to-pass
  state_reset: deterministic
source_of_truth:
  ledger: /workspace/state/ledger.json
  journal: /workspace/state/ledger.json.journal
  manifest: /workspace/state/manifest.json
  order_spec: /workspace/release/order.spec
