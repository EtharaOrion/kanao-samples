services:
  main:
    build:
      context: ${CONTEXT_DIR}
    image: ${MAIN_IMAGE_NAME}
    command: [bash, -c, "/usr/local/bin/task-start.sh; rm -f /usr/local/bin/task-start.sh; exec sleep infinity"]
    environment:
      - TEST_DIR=${TEST_DIR}
    deploy:
      resources:
        limits:
          cpus: "${CPUS}"
          memory: ${MEMORY}
